<!DOCTYPE html>
<html>

<head>
    <title>Navigation Bar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .topnav a {
            float: center;
            color: rgb(10, 219, 114);
            text-align: center;
            padding: 15px, 20px;
            font-size: 17px;
        }

        .topnav a:hover {
            background-color: rgb(255, 178, 13);
            color: teal;
        }

        .topnav a.active {
            background-color: rgb(248, 7, 67);
            color: rgb(7, 224, 188)
        }
    </style>
</head>

<body>
    <div class="topnav">
        <a class="active" href="https://www.minecraft.net/en-us">Minecraft🐔</a>
        <a href="https://store.epicgames.com/">Epic Games🎮</a>
        <a href="https://www.geoguessr.com/">Geoguesser🗺</a>
        <a href="https://subnautica.com/en">Subnautica 2 👻🐟</a>
    </div>

</body>
</html>
