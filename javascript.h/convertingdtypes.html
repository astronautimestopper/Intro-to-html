<!DOCTYPE html>
<html>
    <head>
        <title>Coverting into strings and numbers</title>
        <h2>Converting using String() and Number()</h2>
    </head>
    <body>
        <p id="number_result"></p>
        <p id="number_result2"></p>
        <p id="string_result"></p>
        <script>
            var x = 34.7;
            var y = 24*4;
            document.getElementById("number_result").innerHTML = x-y
             document.getElementById("number_result2").innerHTML = x+y
              document.getElementById("string_result").innerHTML = String(x) + String(y);
        </script>
    </body>
</html>
