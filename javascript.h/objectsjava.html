<!DOCTYPE html>
<html>
    <head>
        <title>Objects in Javascript</title>
    </head>
    <center>
    <body>
        <h2>Javascript Objects and its Porperties</h2>
        <p>There are 2 different ways to access an object property</p>
        <p>They are .property and ["property"].</p>
        <p id="demo"></p>
        <script>
        var person = {
            Firstname: "Ali",
            Age: 12
        };

        document.getElementById("demo").innerHTML = person.Firstname + " is " + person.Age + " years old" 
        </script>
    </body>
</html>
