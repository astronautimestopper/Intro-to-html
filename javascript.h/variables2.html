<!DOCTYPE html>
<html>
    <head>
        <title>Variables in Javascript</title>
    </head>

    <body>
        <h1>Variables</h1>
        <p>Variables is a way of storing data</p>
        <p id="answer"></p>
        
        <script>
            var number1=4.3;
            var number2=5.7;
            var number3=5679;
            var answer=number1+number2+number3;

        document.getElementById("answer").innerHTML = answer;
        </script>
    </body>
</html>
