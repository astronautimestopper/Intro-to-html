<!DOCTYPE html>
<html>
    <center>
        <head>
            <style>
                h2{
                    background-color: rgb(18, 178, 206);
                    font-family: arial, sans-serif;
                }
            </style>
        </head>
    <title>Nodes in Javascript</title>
    <body>
        <h2>My Zoo!</h2>
        <p>Use Javascript and the DOM to add animals to each enclosure</p>

        <div id="zoo">
            <div class="zone">Zone 1:<span id="zone1"></span></div>
            <div class="zone">Zone 2:<span id="zone2"></span></div>
            <div class="zone">Zone 3:<span id="zone3"></span></div>
            <div class="zone">Total animals in the zoo:<span id="total"></span></div>
        </div>
        <br>
        <button onclick="openZoo()">Open Zoo!</button>
        <p id="zoo-status"></p>
        <script>
      function openZoo() {
   document.getElementById("zone1").innerHTML = "Panda"
   document.getElementById("zone2").innerHTML = "Tutle"
   document.getElementById("zone3").innerHTML = "Tiger"
   document.getElementById("total").innerHTML = "3"
   document.getElementById("zoo").style.backgroundColor = "darkgreen"
   document.getElementById("zoo-status").innerHTML = document.title = "Zoo is now open"
      
      }
      
        </script>
    </body>
</html>
