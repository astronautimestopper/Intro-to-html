<!DOCTYPE html>
<html>
    <head>
        <title>Conditional statements in Javascript</title>
        <h2>This website can tell you the time</h2>
    </head>
    <body>
        <p>Click the button below to get a time-based greeting</p>
        <button onclick = "myfunction()">Try it </button>
        <p id="hour"></p>
        <p id="greet"></p>
        <script>
            function myfunction(){
                var greeting;
                var time = new Date().getHours();
             
              if(time < 10){
                greeting = "Good Morning";
              }

               if (time < 20) {
                    greeting = "Good Afternoon";
                }

                 else {
                    greeting = "Good Evening";
                }
                document.getElementById("hour").innerHTML = "Current hour is :" + time;
                 document.getElementById("greet").innerHTML = greeting;
            }
        </script>
    </body>
</html>
