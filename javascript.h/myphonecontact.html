<!DOCTYPE html>
<html>
    <head>
        <title>My Phone Contact</title>
    </head>
    <body>
        <h2>This is My Phone Contact</h2>
        <p id="contact"></p>
        <script>
         var phone_contact = {
           Name : "Motorola",
           Contact : "12323456456786789089",
           School : "Leigh Academy - one of Many",
           City : "London"
         }
         document.getElementById("contact").innerHTML = phone_contact["Name"] + phone_contact["Contact"] +"<br>" + phone_contact["School"] + phone_contact["City"]
        </script>
    </body>
</html>
