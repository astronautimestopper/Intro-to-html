<!DOCTYPE html>
<html>
    <body>
        <h2>Javascript Array Methods</h2>
        <h2>join() and pop()</h2>

        <p>Join() converts array elements into a single string.</p>
        <p>Pop() removes the last element from an array.</p>
      <p id="myjoin"></p>
       <p id="myfirstpop"></p> 
       <p id="mysecondpop"></p>

       <script>
         var fruits = [ "Banana", "Orange", "Apple", "Mango"]
         document.getElementById("myjoin").innerHTML = fruits.join("Banana*Mango")
         document.getElementById("myfirstpop").innerHTML = fruits; 
         document.getElementById("myfirstpop").innerHTML = fruits.pop("")
         document.getElementById("mysecondpop").innerHTML = fruits;
      

       </script>
    </body>
</html>
